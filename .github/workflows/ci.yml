name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: sudo apt-get update && sudo apt-get install -y xvfb

      - run: xvfb-run npx playwright test

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Package extension
        run: |
          zip -r currio-v${{ steps.version.outputs.version }}.zip . \
            -x "node_modules/*" ".git/*" ".claude/*" ".wolf/*" "e2e/*" "test-results/*" "scripts/*" \
               ".github/*" "*.DS_Store" ".DS_Store" "landing/*" \
               "package*.json" "playwright*" "*.zip" "CLAUDE.md" "Dockerfile*" "docker-compose*"

      - uses: actions/upload-artifact@v4
        with:
          name: currio-v${{ steps.version.outputs.version }}
          path: currio-v${{ steps.version.outputs.version }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: currio-v${{ needs.build.outputs.version }}

      - uses: softprops/action-gh-release@v2
        with:
          name: v${{ needs.build.outputs.version }}
          files: currio-v${{ needs.build.outputs.version }}.zip
          generate_release_notes: true

      - uses: actions/github-script@v7
        env:
          VERSION: ${{ needs.build.outputs.version }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = `v${process.env.VERSION}`;
            const expectedAsset = `currio-v${process.env.VERSION}.zip`;

            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner,
              repo,
              tag,
            });

            const { data: notes } = await github.rest.repos.generateReleaseNotes({
              owner,
              repo,
              tag_name: tag,
              target_commitish: context.sha,
            });

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.id,
              name: tag,
              body: notes.body,
            });

            for (const asset of release.assets) {
              if (asset.name !== expectedAsset) {
                await github.rest.repos.deleteReleaseAsset({
                  owner,
                  repo,
                  asset_id: asset.id,
                });
              }
            }
