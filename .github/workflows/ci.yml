name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: sudo apt-get update && sudo apt-get install -y xvfb

      - run: xvfb-run npx playwright test

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(node -p "require('./manifest.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate version format
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "::error::Invalid version format '$VERSION'. Must be 1-4 dot-separated numbers (e.g. 1.0.4)"
            exit 1
          fi

      - name: Sync manifest version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e "const m=require('./manifest.json');m.version='${{ steps.version.outputs.version }}';require('fs').writeFileSync('./manifest.json',JSON.stringify(m,null,2)+'\n')"

      - name: Package extension
        run: |
          zip -r currio-v${{ steps.version.outputs.version }}.zip . \
            -x "node_modules/*" ".git/*" ".claude/*" ".wolf/*" ".idea/*" "e2e/*" \
               "test-results/*" "scripts/*" ".github/*" "landing/*" \
               "*.DS_Store" ".DS_Store" "package*.json" "playwright*" "*.zip" \
               "CLAUDE.md" "Dockerfile*" "docker-compose*"

      - uses: actions/upload-artifact@v4
        with:
          name: currio-v${{ steps.version.outputs.version }}
          path: currio-v${{ steps.version.outputs.version }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: currio-v${{ needs.build.outputs.version }}

      - uses: softprops/action-gh-release@v2
        with:
          name: v${{ needs.build.outputs.version }}
          files: currio-v${{ needs.build.outputs.version }}.zip
          generate_release_notes: true

  publish:
    needs: [build, release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: currio-v${{ needs.build.outputs.version }}

      - name: Upload to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: currio-v${{ needs.build.outputs.version }}.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true
