<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Currio</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1 class="title">Currio</h1>

    <label class="field">
      <span id="targetCurrencyLabel"></span>
      <select id="targetCurrency"></select>
    </label>

    <div class="blacklist-section">
      <div class="current-domain" id="currentDomainBlock">
        <span class="domain-label" id="currentSiteLabel"></span>
        <span class="domain-name" id="currentDomainName">—</span>
        <button id="toggleDomainBtn" class="btn-small"></button>
      </div>
      <details id="blacklistDetails">
        <summary id="blacklistSummary"></summary>
        <textarea id="blacklist" rows="4"></textarea>
      </details>
    </div>

    <div class="actions">
      <button id="rescanBtn" class="btn-outline">🔄 强制重扫</button>
    </div>
    <div class="footer-links">
      <a id="reportLink" href="#" target="_blank" class="footer-link">🐛 报告问题</a>
      <span class="footer-dot">·</span>
      <span id="donateLink" class="footer-link">☕ 请喝咖啡</span>
    </div>

    <div id="donateModal" class="modal-overlay">
      <div class="modal-content">
        <button id="donateClose" class="modal-close">&times;</button>
        <img id="donateImage" src="" alt="Support QR" class="donate-image" />
        <p class="donate-text">谢谢你的支持！每一杯咖啡都是动力 ☕</p>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
