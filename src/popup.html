<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Currio</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1 class="title">Currio</h1>

    <label class="field">
      <span>__MSG_targetCurrency__</span>
      <select id="targetCurrency">
        <optgroup data-i18n="currencyGroupAsia">
          <option value="TWD">__MSG_currency_twd__</option>
          <option value="CNY">__MSG_currency_cny__</option>
          <option value="JPY">__MSG_currency_jpy__</option>
          <option value="KRW">__MSG_currency_krw__</option>
          <option value="HKD">__MSG_currency_hkd__</option>
          <option value="SGD">__MSG_currency_sgd__</option>
        </optgroup>
        <optgroup data-i18n="currencyGroupOther">
          <option value="USD">__MSG_currency_usd__</option>
          <option value="EUR">__MSG_currency_eur__</option>
          <option value="GBP">__MSG_currency_gbp__</option>
          <option value="AUD">__MSG_currency_aud__</option>
          <option value="CAD">__MSG_currency_cad__</option>
        </optgroup>
      </select>
    </label>

    <label class="field checkbox-field">
      <input type="checkbox" id="autoEnabled">
      <span>__MSG_autoEnabled__</span>
    </label>

    <div class="blacklist-section">
      <div class="current-domain" id="currentDomainBlock">
        <span class="domain-label">__MSG_currentSite__</span>
        <span class="domain-name" id="currentDomainName">—</span>
        <button id="toggleDomainBtn" class="btn-small"></button>
      </div>
      <details id="blacklistDetails">
        <summary id="blacklistSummary"></summary>
        <textarea id="blacklist" rows="4" data-i18n-placeholder="blacklistPlaceholder"></textarea>
      </details>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
