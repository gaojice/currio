<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Currio</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1 class="title">Currio</h1>

    <label class="field">
      <span id="targetCurrencyLabel"></span>
      <select id="targetCurrency">
        <optgroup id="currencyGroupAsia"></optgroup>
        <optgroup id="currencyGroupOther"></optgroup>
      </select>
    </label>

    <label class="field checkbox-field">
      <input type="checkbox" id="autoEnabled">
      <span id="autoEnabledLabel"></span>
    </label>

    <div class="blacklist-section">
      <div class="current-domain" id="currentDomainBlock">
        <span class="domain-label" id="currentSiteLabel"></span>
        <span class="domain-name" id="currentDomainName">—</span>
        <button id="toggleDomainBtn" class="btn-small"></button>
      </div>
      <details id="blacklistDetails">
        <summary id="blacklistSummary"></summary>
        <textarea id="blacklist" rows="4"></textarea>
      </details>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
