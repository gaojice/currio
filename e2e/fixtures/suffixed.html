  <title>Suffixed Amounts</title>
</head>
<body>
  <h1>Amounts with letter suffixes ($13M, $100k etc.)</h1>
  <ul>
    <li>Million: $13M</li>
    <li>Thousand: $100k</li>
    <li>Billion: $1.5B</li>

  </ul>
