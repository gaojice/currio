<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Taobao-style Split Prices</title>
</head>
<body>
  <h1>Split ￥ prices</h1>
  <!-- Highlight price -->
  <div class="priceWrap">
    <div class="highlightPrice" style="color:#FF5000">
      <span class="title">秒杀价</span>
      <span class="symbol">￥</span>
      <span class="text">2.01</span>
    </div>
    <!-- Sub price -->
    <div class="subPrice" style="color:#7A7A7A">
      <span class="title">优惠前</span>
      <span class="text">￥</span>
      <span class="text">4.01</span>
    </div>
  </div>
</body>
</html>
