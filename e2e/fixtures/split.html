<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <title>Split Currency Symbols</title>
</head>
<body>
  <h1>Currency symbols split across elements</h1>
  <!-- $ in one span, number in another -->
  <p>Price: <span class="qa-product-actual-price">
    <span class="currency-symbol">$</span><span>499</span>
  </span></p>
  <!-- € split -->
  <p>Price: <span class="price">
    <span class="sym">€</span><span class="val">25</span>
  </span></p>
</body>
</html>
