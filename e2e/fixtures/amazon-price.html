<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Amazon-style HKD Prices</title>
</head>
<body>
  <h1>Amazon-style HKD Prices</h1>

  <div id="corePrice_feature_div">
    <div class="a-section apex-core-price-identifier">
      <span id="offer-price" class="a-price aok-align-center apex-pricetopay-value" data-a-size="xl" data-a-color="base">
        <span class="a-offscreen">HKD2,648.34</span>
        <span aria-hidden="true">
          <span class="a-price-symbol">HKD</span>
          <span class="a-price-whole">2,648<span class="a-price-decimal">.</span></span>
          <span class="a-price-fraction">34</span>
        </span>
      </span>
    </div>
  </div>

  <div id="corePriceDisplay_desktop_feature_div">
    <div class="a-section apex-core-price-identifier">
      <span id="apex-pricetopay-accessibility-label" class="aok-offscreen"> HKD&nbsp;2,648.34 </span>
      <span id="center-column-price" class="a-price aok-align-center reinventPricePriceToPayMargin priceToPay apex-pricetopay-value" data-a-size="xl" data-a-color="base">
        <span class="a-offscreen"> </span>
        <span aria-hidden="true">
          <span class="a-price-symbol">HKD</span>
          <span class="a-price-whole">2,648<span class="a-price-decimal">.</span></span>
          <span class="a-price-fraction">34</span>
        </span>
      </span>
    </div>
  </div>

  <div id="twisterPlusPriceSubtotalWWDesktop_feature_div">
    <span id="price_block_currency_symbol_ww" class="a-size-medium a-price-symbol">HKD</span>
    <span class="a-size-medium a-text-bold">
      <span id="subtotal-price" class="a-price" data-a-size="m" data-a-color="base">
        <span class="a-offscreen">HKD&nbsp;2,648.34</span>
        <span aria-hidden="true">
          <span class="a-price-symbol"></span>
          <span class="a-price-whole">2,648<span class="a-price-decimal">.</span></span>
          <span class="a-price-fraction">34</span>
        </span>
      </span>
    </span>
  </div>
</body>
</html>
